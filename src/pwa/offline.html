<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexion</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(145deg, #f6f9ff 0%, #eef5ff 100%);
      color: #0f172a;
    }
    .card {
      width: min(92vw, 520px);
      background: #ffffff;
      border: 1px solid #dbe7ff;
      border-radius: 16px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      padding: 22px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }
    p {
      margin: 0;
      color: #334155;
      line-height: 1.5;
    }
    .hint {
      margin-top: 14px;
      font-size: 0.93rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Sin conexion a internet</h1>
    <p>No se pudo cargar esta pagina en este momento.</p>
    <p class="hint">Cuando vuelva la conexion, recarga para continuar.</p>
  </section>
</body>
</html>
