<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">INBIOSLAB - Cotizacion online</title>
  <desc id="desc">Imagen de vista previa social por defecto para compartir enlaces del portal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e385f"/>
      <stop offset="55%" stop-color="#1f6d92"/>
      <stop offset="100%" stop-color="#35b8cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#052033" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.2" fill="#ffffff">
    <circle cx="1070" cy="110" r="160"/>
    <circle cx="990" cy="560" r="220"/>
    <circle cx="200" cy="70" r="120"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="78" width="1060" height="474" rx="26" fill="#ffffff" fill-opacity="0.11"/>
  </g>

  <g fill="#ffffff" font-family="Segoe UI, Tahoma, Arial, sans-serif">
    <text x="120" y="220" font-size="44" font-weight="700" letter-spacing="1.2">LABORATORIO CLINICO</text>
    <text x="120" y="320" font-size="86" font-weight="800" letter-spacing="1.5">INBIOSLAB</text>
    <text x="120" y="392" font-size="34" font-weight="500">Cotiza tus examenes online de forma rapida y segura</text>

    <g transform="translate(120,438)">
      <rect width="370" height="66" rx="33" fill="#ffffff" fill-opacity="0.18"/>
      <text x="32" y="43" font-size="30" font-weight="700">Resultados confiables</text>
    </g>
  </g>
</svg>
